<!doctype html>
<html lang="zh-CN">
<head>

<title>第二章｜美食词语创新实验室</title>
<style>
:root{--red:#7b1424;--gold:#f5c86d;--cream:#fff4d8;--ink:#412518;--green:#24795e}*{box-sizing:border-box}body{margin:0;min-height:100dvh;color:var(--cream);font-family:"Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;background:radial-gradient(circle at 10% 10%,#c74339 0,transparent 30%),radial-gradient(circle at 90% 80%,#8a2845 0,transparent 35%),linear-gradient(135deg,#3e0a1a,#751726 55%,#2b0d23);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;background:repeating-linear-gradient(45deg,transparent 0 22px,#f6bb57 23px 24px,transparent 25px 46px)}.wrap{position:relative;max-width:850px;margin:auto;padding:18px 15px 40px}.top{text-align:center;padding:16px 8px}.eyebrow{font-size:.82rem;letter-spacing:.2em;color:#ffe0a2}.top h1{margin:8px 0;font-size:clamp(1.65rem,6vw,2.7rem);text-shadow:0 3px 0 #4e0a16}.top p{margin:6px 0;color:#ffe9c5}.panel{background:linear-gradient(155deg,#fff8e7,#f6dfb7);border:3px solid #e6ad51;box-shadow:0 12px 35px #1d03198a,inset 0 0 0 3px #fff6db;border-radius:22px;color:var(--ink);padding:clamp(16px,4vw,28px);margin:14px 0}.stats{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.chip{background:#691727;color:#ffe6b1;border:1px solid #e9b85b;border-radius:100px;padding:8px 13px;font-weight:700}.progress{height:12px;border-radius:20px;background:#e9cfa4;overflow:hidden;margin:16px 0 5px}.bar{height:100%;width:0;background:linear-gradient(90deg,#d86c36,#aa1833);transition:width .3s}.scene{border-radius:18px;padding:18px;background:linear-gradient(120deg,#6f192b,#a53535);color:#fff4d8;text-align:center;box-shadow:inset 0 0 0 2px #e6ad51}.food{font-size:clamp(3rem,10vw,5rem);margin:5px 0}.scene h2{margin:5px 0;font-size:1.55rem}.scene p{margin:5px 0;line-height:1.6}.question{font-weight:800;font-size:1.12rem;margin:20px 0 12px;line-height:1.55}.options{display:grid;grid-template-columns:1fr 1fr;gap:11px}.opt{border:2px solid #dbad68;background:#fff9eb;border-radius:15px;padding:16px 12px;font:700 1rem inherit;font-family:inherit;font-weight:700;color:#4b2520;min-height:78px;cursor:pointer;transition:transform .15s,border-color .15s,background .15s}.opt:active{transform:scale(.97)}.opt:hover{border-color:#9f2a2b}.opt:disabled{cursor:default;opacity:.83}.opt.good{background:#d4f2d9;border-color:#278c57}.opt.bad{background:#ffe0dc;border-color:#d64545}.feedback{margin-top:16px;padding:14px;border-radius:14px;background:#f5e3bd;line-height:1.65;min-height:60px}.feedback strong{color:#8d1c2a}.btn{display:block;width:100%;border:0;border-radius:15px;padding:15px 20px;margin-top:16px;background:linear-gradient(180deg,#e65e43,#9e1b2e);color:white;font-family:inherit;font-size:1.05rem;font-weight:800;cursor:pointer;box-shadow:0 5px 0 #661327}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #661327}.btn:disabled{opacity:.55;cursor:default}.hidden{display:none!important}.center{text-align:center}.small{font-size:.85rem;color:#704b37}.stamp{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;border:8px double #ffd68c;border-radius:50%;width:175px;height:175px;background:radial-gradient(circle,#e44938,#861128);box-shadow:0 0 0 5px #991d2b,0 12px 25px #4c0d2390;color:#ffeab6;transform:rotate(-9deg);margin:20px}.stamp span{font-size:2.7rem}.stamp b{font-size:1.3rem}.review{text-align:left;background:#fff9e9;border-radius:12px;padding:12px 18px;line-height:1.7}.review p{border-bottom:1px dashed #dab984;padding-bottom:9px}.footer{text-align:center;color:#ffdfb0;font-size:.8rem;padding:10px}#start .lead{line-height:1.85}#start .examples{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}#start .examples span{padding:9px 13px;background:#f5d9a6;border-radius:40px;font-weight:700}@media(max-width:460px){.options{grid-template-columns:1fr}.opt{min-height:62px}.panel{padding:16px}.stats{justify-content:center}}
.back-book{display:block;text-decoration:none;margin:12px auto 4px;padding:12px 20px;max-width:360px;text-align:center;border:2px solid #f4d58a;border-radius:999px;background:#5a1325;color:#fff0c8;font:700 1rem "Microsoft YaHei",sans-serif;cursor:pointer;box-shadow:0 3px 12px #28091677}.back-book:hover{background:#82243b}.back-book:focus-visible{outline:3px solid #fff}</style>
</head>
<body><main class="wrap"><header class="top"><div class="eyebrow">舌尖上的马来西亚 · 第二章</div><h1>🍜 美食词语创新实验室</h1><p>新造词 ≠ 旧词新义｜五关挑战</p></header>
<button type="button" class="back-book" id="backBook">📖 关闭游戏 · 返回原本电子书</button><section class="panel" id="start"><div class="center"><div style="font-size:4rem">🧪🍔</div><h2>实验室任务书</h2><p class="lead">马来西亚美食不断出现新名称。你能分辨<strong>新造词</strong>与<strong>旧词新义</strong>，判断名称背后的文化价值吗？<br>完成五关，解锁第二章「创新词印章」！</p><div class="examples"><span>🍔 椰浆饭汉堡</span><span>🍕 参巴披萨</span><span>🌈 彩虹糕</span></div><p class="small">每关选择一个答案，立即获得解析。手机和电脑都能游玩。</p><button class="btn" id="startBtn">▶ 开始五关挑战</button></div></section>
<section class="panel hidden" id="game"><div class="stats"><span class="chip" id="level">第 1 / 5 关</span><span class="chip" id="score">得分：0</span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="scene"><div class="food" id="emoji"></div><h2 id="foodTitle"></h2><p id="foodSub"></p></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback hidden" id="feedback" aria-live="polite"></div><button class="btn hidden" id="nextBtn">下一关 →</button></section>
<section class="panel hidden center" id="end"><h2>🎉 实验完成！</h2><div class="stamp"><span>💡</span><b>创新词</b><b>印章</b></div><h2 id="finalScore"></h2><p id="finalMsg"></p><div class="review" id="review"></div><button class="btn" id="retryBtn">↻ 再挑战一次</button></section><footer class="footer">第二章 · 语言创新与文化价值｜互动小游戏</footer></main>
<script>
'use strict';
const questions=[
{emoji:'🍔',title:'椰浆饭汉堡',sub:'熟悉的本地味道，遇上西式汉堡。',q:'「椰浆饭汉堡」这个名称最主要体现什么？',options:['组合已有词语，为新式食品命名','「汉堡」原本的词义完全消失','把「椰浆饭」改成方言词','所有旧词都变成了外来词'],answer:0,why:'它把「椰浆饭」和「汉堡」组合起来，给融合式食品命名，体现饮食文化的创新。'},
{emoji:'🍕',title:'参巴披萨',sub:'香辣参巴风味 × 披萨。',q:'「参巴披萨」的命名方式最接近哪一种？',options:['将本地食材风味与外来食品名称结合','把「披萨」的含义缩小成一种酱料','直接沿用一个古代成语','网络缩写的谐音表达'],answer:0,why:'「参巴」指向本地风味，「披萨」是另一种饮食文化中的食品名称；组合凸显跨文化创意。'},
{emoji:'🌈',title:'彩虹糕',sub:'从自然现象到色彩缤纷的糕点。',q:'「彩虹」本来指自然现象，后来用来形容糕点的色彩。这更接近什么？',options:['旧有词语在新语境中延伸用法','完全没有任何语义联系的新词','只能算方言传播','把糕点改名为外来词'],answer:0,why:'「彩虹」原指自然现象，在「彩虹糕」中借其多彩特征描写食品，体现旧词在新语境中的引申和组合。'},
{emoji:'🔎',title:'语言侦探辨析',sub:'两个概念，看起来相似却不一样。',q:'下列哪一种说法最准确？',options:['新造词重在产生新的表达；词义演变重在已有词义的变化','新造词与词义演变完全相同','所有美食名称都属于新造词','只要用了外来词，就没有文化意义'],answer:0,why:'新造词关注新词语或新组合的出现；词义演变关注既有词语的意义如何扩大、缩小或转移，两者可能有关联但不能混为一谈。'},
{emoji:'🏆',title:'文化价值评审',sub:'你是美食创新名称的最后评审。',q:'怎样的创新美食名称更有文化价值？',options:['既让人理解食物特色，也体现文化来源与融合','只要名字夸张就一定成功','越难懂越能代表文化','完全不需要考虑原有文化背景'],answer:0,why:'有价值的命名不仅要新颖，也应让读者理解食物特点，尊重文化来源，并反映不同饮食传统的交流。'}
];
// Shuffle the visible answer positions to make the challenge meaningful.
let idx=0,points=0,history=[],currentOrder=[],locked=false;
const $=id=>document.getElementById(id);
function shuffle(arr){let a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function start(){idx=0;points=0;history=[];$('start').classList.add('hidden');$('end').classList.add('hidden');$('game').classList.remove('hidden');render();}
function render(){locked=false;const q=questions[idx];$('level').textContent=`第 ${idx+1} / ${questions.length} 关`;$('score').textContent=`得分：${points}`;$('bar').style.width=`${idx/questions.length*100}%`;$('emoji').textContent=q.emoji;$('foodTitle').textContent=q.title;$('foodSub').textContent=q.sub;$('question').textContent=q.q;$('feedback').classList.add('hidden');$('nextBtn').classList.add('hidden');$('nextBtn').textContent=idx===questions.length-1?'查看成绩与印章 ✨':'下一关 →';$('options').innerHTML='';currentOrder=shuffle(q.options.map((_,i)=>i));currentOrder.forEach((originalIndex,displayIndex)=>{let b=document.createElement('button');b.className='opt';b.textContent=`${'ABCD'[displayIndex]}. ${q.options[originalIndex]}`;b.addEventListener('click',()=>choose(originalIndex,b));$('options').appendChild(b);});}
function choose(originalIndex,button){if(locked)return;locked=true;const q=questions[idx],correct=originalIndex===q.answer;if(correct)points+=20;history.push({title:q.title,correct,why:q.why});Array.from($('options').children).forEach((b,i)=>{b.disabled=true;if(currentOrder[i]===q.answer)b.classList.add('good');});if(!correct)button.classList.add('bad');$('score').textContent=`得分：${points}`;$('bar').style.width=`${(idx+1)/questions.length*100}%`;$('feedback').innerHTML=`<strong>${correct?'✓ 判断正确！':'✗ 这次没有答对。'}</strong><div>${q.why}</div>`;$('feedback').classList.remove('hidden');$('nextBtn').classList.remove('hidden');}
function next(){idx++;if(idx<questions.length){render();return;}$('game').classList.add('hidden');$('end').classList.remove('hidden');$('finalScore').textContent=`最终得分：${points} / 100`;$('finalMsg').textContent=points===100?'满分！你已掌握本章的核心知识。':points>=60?'挑战完成！回顾解析，理解词语创新与文化融合。':'挑战完成！再试一次，成为更敏锐的语言侦探。';$('review').innerHTML='<h3>🔍 五关知识回顾</h3>'+history.map((h,i)=>`<p><strong>${i+1}. ${h.title} ${h.correct?'✓':'✗'}</strong><br>${h.why}</p>`).join('');window.scrollTo({top:0,behavior:'smooth'});}
// Prefer closing the game tab so the original Heyzine reading position remains intact.
// Browsers may block closing tabs not opened by script; navigate to the public book then.
$('backBook').addEventListener('click',()=>{
  window.close();
  setTimeout(()=>{ if(!document.hidden) window.location.href='https://heyzine.com/flip-book/93e87995ba.html'; },350);
});
$('startBtn').addEventListener('click',start);$('nextBtn').addEventListener('click',next);$('retryBtn').addEventListener('click',start);
</script></body></html>
